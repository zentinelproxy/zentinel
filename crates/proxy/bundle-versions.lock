# Zentinel Distribution Bundle - Version Lock File
#
# The single source of truth for `zentinel bundle`:
#   - the binary embeds this file at compile time (`bundle install` uses it);
#   - crates/proxy/bundle-versions.lock is a byte-identical copy, because
#     `cargo publish` only packages files inside the crate;
#   - api.zentinelproxy.io serves /v1/bundle/ from a vendored copy
#     (data/bundle-versions.lock there), which `bundle update` reads.
#
# An agent is listed only if its release exists for every platform listed
# for it. `python3 scripts/check-bundle-lock.py` (CI job "Bundle lock")
# requests every asset URL and fails otherwise, so release the agent first,
# then update this file in both places, then the API copy.
#
# Asset URL: https://github.com/<repository>/releases/download/v<version>/
#            <binary>-<version>-<platform>.tar.gz   (+ optional .sha256)
# <binary> is zentinel-<name>-agent unless [binary_names] says otherwise.
# Format: CalVer for bundle, SemVer for agents

[bundle]
# Bundle version (CalVer: YY.MM_PATCH)
version = "26.10_01"
# Platforms every agent is released for, unless [platforms] overrides it.
# darwin-x86_64 is not built by any agent release workflow.
platforms = ["linux-x86_64", "linux-aarch64", "darwin-aarch64"]

[agents]
# Core agents (included in default bundle install)
waf = "0.4.0"
ratelimit = "0.3.0"
denylist = "0.3.0"

# Security agents
zentinelsec = "0.4.0"
modsec = "0.4.0"
ip-reputation = "0.4.0"
bot-management = "0.4.0"
content-scanner = "0.4.0"

# API security agents
graphql-security = "0.4.0"
grpc-inspector = "0.4.0"
soap = "0.4.0"
api-deprecation = "0.4.0"

# Protocol agents
websocket-inspector = "0.4.0"
mqtt-gateway = "0.4.0"

# Scripting agents
lua = "0.3.0"
js = "0.3.0"
wasm = "0.3.0"

# Utility agents
transform = "0.4.0"
audit-logger = "0.4.0"
mock-server = "0.4.0"
chaos = "0.4.0"
image-optimization = "0.2.0"

# Identity agents
spiffe = "0.3.0"

# Not in the bundle, because no release asset exists under the URL above:
#   auth          0.2.0 ships only `sentinel-auth-agent-linux-amd64`
#   policy        no release
#   ai-gateway    no release
#   data-masking  no repository zentinelproxy/zentinel-agent-data-masking

[repositories]
# Core agents
waf = "zentinelproxy/zentinel-agent-waf"
ratelimit = "zentinelproxy/zentinel-agent-ratelimit"
denylist = "zentinelproxy/zentinel-agent-denylist"

# Security agents
zentinelsec = "zentinelproxy/zentinel-agent-zentinelsec"
modsec = "zentinelproxy/zentinel-agent-modsec"
ip-reputation = "zentinelproxy/zentinel-agent-ip-reputation"
bot-management = "zentinelproxy/zentinel-agent-bot-management"
content-scanner = "zentinelproxy/zentinel-agent-content-scanner"

# API security agents
graphql-security = "zentinelproxy/zentinel-agent-graphql-security"
grpc-inspector = "zentinelproxy/zentinel-agent-grpc-inspector"
soap = "zentinelproxy/zentinel-agent-soap"
api-deprecation = "zentinelproxy/zentinel-agent-api-deprecation"

# Protocol agents
websocket-inspector = "zentinelproxy/zentinel-agent-websocket-inspector"
mqtt-gateway = "zentinelproxy/zentinel-agent-mqtt-gateway"

# Scripting agents
lua = "zentinelproxy/zentinel-agent-lua"
js = "zentinelproxy/zentinel-agent-js"
wasm = "zentinelproxy/zentinel-agent-wasm"

# Utility agents
transform = "zentinelproxy/zentinel-agent-transform"
audit-logger = "zentinelproxy/zentinel-agent-audit-logger"
mock-server = "zentinelproxy/zentinel-agent-mock-server"
chaos = "zentinelproxy/zentinel-agent-chaos"
image-optimization = "zentinelproxy/zentinel-agent-image-optimization"

# Identity agents
spiffe = "zentinelproxy/zentinel-agent-spiffe"

[platforms]
# Per-agent overrides of [bundle] platforms (none at the moment).

[checksums]
# SHA256 checksums for verification (optional, updated by release CI)
# Format: agent-version-os-arch = "sha256:..."
