# CI workflow - runs on every push and pull request
# Validates code quality: formatting, linting, documentation, and unit tests.
# Unit (lib) tests run here so regressions are caught before merge; the full
# test suite (integration, doc tests) is in tests.yml (manual / weekly /
# push-to-main only) to keep PR-trigger Action minutes low. On PRs, the
# integration test targets the PR itself adds or changes run here too.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-version:
    name: Rust version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Rust version is declared in three places. The Dockerfile drifted to
      # 1.94 while the workspace moved to 1.95, and nothing noticed: release CI
      # builds the `*-prebuilt` stages, which copy a binary compiled elsewhere
      # and never touch the base image. Only `docker compose build` and a plain
      # `docker build .` use the `builder` stage -- so the images humans build
      # were broken while every workflow stayed green.
      - name: Check Cargo.toml, rust-toolchain.toml and Dockerfile agree
        run: |
          set -euo pipefail

          toolchain=$(grep -oE 'channel = "[0-9.]+"' rust-toolchain.toml | grep -oE '[0-9.]+')
          msrv=$(grep -m1 -oE 'rust-version = "[0-9.]+"' Cargo.toml | grep -oE '[0-9.]+')
          docker=$(grep -m1 -oE '^ARG RUST_VERSION=[0-9.]+' Dockerfile | cut -d= -f2)

          echo "rust-toolchain.toml : $toolchain"
          echo "Cargo.toml rust-version: $msrv"
          echo "Dockerfile RUST_VERSION: $docker"

          # Compare on major.minor: the Dockerfile tracks the Rust image tag
          # (`rust:1.95-slim-bookworm`), which has no patch component.
          minor() { echo "$1" | cut -d. -f1,2; }

          if [ "$(minor "$toolchain")" != "$(minor "$msrv")" ]; then
            echo "::error::rust-toolchain.toml ($toolchain) and Cargo.toml rust-version ($msrv) disagree"
            exit 1
          fi

          if [ "$(minor "$docker")" != "$(minor "$toolchain")" ]; then
            echo "::error::Dockerfile RUST_VERSION ($docker) does not match the toolchain ($toolchain). \
          The builder stage will fail to compile the workspace; release CI will not catch it, because \
          it builds the prebuilt stages instead."
            exit 1
          fi

          echo "All three agree on $(minor "$toolchain")"

  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-doc-

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      # --all-features here too: without it, docs on feature-gated items are
      # never rendered and their broken links go unnoticed.
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-test-lib-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-lib-

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      # --all-features matches the clippy job above. Without it, optional
      # features are compiled by clippy but executed by nothing, which is how
      # `binary-uds` shipped hanging every agent call but one (#359, #360).
      - name: Run unit tests
        run: cargo test --workspace --lib --all-features

  # Integration tests (crates/*/tests/) run only after merge, in tests.yml, so
  # the test a PR adds to prove its fix was never run before the merge. #569's
  # tests/sigusr_test.rs could not pass without a writable /var/log/zentinel,
  # and every check was green (#574, #575).
  #
  # This runs only the test targets the PR adds or changes, which costs
  # nothing on PRs that touch no test. scripts/pr-integration-tests.py maps
  # files to targets via `cargo metadata` (package names differ from
  # directory names; `[[test]]` paths and `autotests` are honoured), and runs
  # every target of a crate when a shared helper under tests/ changes. Run it
  # locally with `scripts/pr-integration-tests.py origin/main`.
  #
  # The job name is meant to become a required check, so keep it stable. On
  # push the job is skipped (the full suite runs in tests.yml), which a
  # required check counts as passing.
  pr-integration-tests:
    name: PR Integration Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # A pull_request checkout is the merge commit refs/pull/N/merge, so
      # HEAD^1 is the base branch tip and HEAD^1...HEAD is the PR's diff.
      # Depth 2 is enough for both.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Plan integration tests
        id: plan
        run: python3 scripts/pr-integration-tests.py HEAD^1 HEAD

      # Everything below is skipped when the plan is empty.
      - name: Free disk space
        if: steps.plan.outputs.targets != '0'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Cache cargo registry
        if: steps.plan.outputs.targets != '0'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      # Same key as tests.yml: main's full-suite build already contains these
      # targets, built with the same flags, so a PR starts from it.
      - name: Cache cargo build
        if: steps.plan.outputs.targets != '0'
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Install protoc
        if: steps.plan.outputs.targets != '0'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      # --all-features, as tests.yml runs these targets after merge.
      - name: Run integration tests
        if: steps.plan.outputs.targets != '0'
        run: python3 scripts/pr-integration-tests.py HEAD^1 HEAD --run

  # Crates in the workspace `exclude` list are built by nothing above, so they
  # can break without any job going red. zentinel-sim did exactly that: it
  # stopped compiling and stayed that way, because `cargo check --workspace`
  # never looks at it (#387).
  #
  # They are excluded for a real reason — sim and playground-wasm depend on
  # zentinel-config with `default-features = false` to stay WASM-compatible,
  # and workspace feature unification would pull `runtime` back in via
  # zentinel-proxy. So they need their own build rather than membership.
  #
  # Covers all four excluded crates. config-inspect and playground-wasm were
  # added once their dependency pins were fixed — they had required
  # zentinel-config/common `^0.5.4` against a workspace at 0.6.27, so they
  # failed at dependency resolution before compiling anything.
  #
  # Internal deps in these crates are pinned as `0.6`, not an exact patch, so a
  # workspace patch release cannot strand them again. A 0.7 bump still will,
  # deliberately: excluded crates cannot use `version.workspace = true`, so
  # something has to notice.
  excluded-crates:
    name: Excluded Crates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-excluded
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      # The root `fmt` job runs `cargo fmt --all` at the workspace, which by
      # definition does not reach an excluded crate. sim had drifted across
      # five files as a result.
      - name: Check formatting (excluded crates)
        run: |
          cargo fmt --manifest-path crates/sim/Cargo.toml --check
          cargo fmt --manifest-path crates/config-inspect/Cargo.toml --check
          cargo fmt --manifest-path crates/playground-wasm/Cargo.toml --check
          cargo fmt --manifest-path agents/wasm-allowlist/Cargo.toml --check

      - name: Test zentinel-sim
        working-directory: crates/sim
        run: cargo test --all-targets

      - name: Test zentinel-config-inspect
        working-directory: crates/config-inspect
        run: cargo test --all-targets

      # Native check only. The real artifact is built for wasm32 by wasm-pack
      # outside CI; this catches the breakage that actually happened — a change
      # in zentinel-config that the crate no longer compiles against.
      - name: Check zentinel-playground-wasm
        working-directory: crates/playground-wasm
        run: cargo check --all-targets

      - name: Check agents/wasm-allowlist
        working-directory: agents/wasm-allowlist
        run: cargo check --all-targets
